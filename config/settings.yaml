# ============================================================
# プロバイダ切り替えガイド（重要・必読）
# ============================================================
#
# このファイルの下の方に llm と tts のセクションがあります。
# それぞれ provider を "openai" / "gemini" のどちらかにすることで
# 使うサービスを切り替えられます。
#
# 【現在の状態】 Gemini 運用（無料枠＋Tier1課金、混雑時はretryで自動待機）
#
# 【OpenAIに切り替える方法】
#   1. このファイル下方の llm.provider を "gemini" → "openai" に変更
#   2. このファイル下方の tts.provider を "gemini" → "openai" に変更
#   3. 保存（Cmd+S）して再実行
#       python generate_episode.py -p centrist
#
# 【コスト目安】
#   - OpenAI（gpt-4o + tts-1）: 月 約$2.70
#   - Gemini（無料枠超過時のみ課金）: 月 約$0〜$0.14
#
# 【トラブル時の判断軸】
#   - 503 high demand が連発する → 一時的に openai に戻す
#   - 429 limit:0 が出る        → モデル名を変えるか課金プラン確認
#   - 401/403 が出る            → APIキーを再確認
# ============================================================

