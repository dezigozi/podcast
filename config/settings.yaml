podcast:
  title: "知のわんこそば"
  description: "毎週、世の中のホットトピックスをAIが解説するポッドキャスト。中道・革新・保守・テック・哲学、5人のAIキャスターがそれぞれの視点で語る。"
  language: "ja"
  max_topics: 25  # キャスター1人あたりの最大記事数

news:
  days_back: 7
  use_hackernews: true
  use_devto: true           # Dev.to API（tech カテゴリのキャスター向け、APIキー不要）
  hackernews_stories: 20

  rss_feeds:
    # 日本
    - url: "https://www3.nhk.or.jp/rss/news/cat0.xml"
