# ────────────────────────────────────
# 台本生成（LLM）
# ────────────────────────────────────
# ★切り替えるときはここ：provider の値を変える
#   "openai" → 確実に動く（月$0.60）
#   "gemini" → 無料運用狙い（混雑時は503エラーが出ることあり、コード側でretry実装済み）
llm:
  provider: "gemini"               # ★ ここを変えると切替（"gemini" / "openai"）
  model: "gemini-2.5-flash"        # provider=gemini のときに使うモデル
                                   #   候補: gemini-2.5-flash（高品質）/ gemini-2.5-flash-lite（軽量）
  max_tokens: 4096                 # 約3000文字 = 約2000トークン + 余裕。
                                   # Thinking はコード側で無効化済みのため、全て出力に使える。
  temperature: 0.85                # 0.0=堅実、1.0=創造的（0.85で創造性寄り）
  openai_model: "gpt-4o"           # provider=openai のときに使うモデル

# ────────────────────────────────────
# 音声生成（TTS）
# ────────────────────────────────────
# ★切り替えるときはここ：provider の値を変える
#   "openai" → 確実に動く（月$2.10、合計$2.70）
#   "gemini" → 無料運用狙い（品質は同等以上、混雑時は503エラーあり、retry実装済み）
tts:
  provider: "gemini"                    # ★ ここを変えると切替（"gemini" / "openai"）
  model: "gemini-2.5-flash-preview-tts" # provider=gemini のときに使うTTSモデル
  speed: 1.0                            # 1.0=通常、1.1〜1.2=やや速め

  # provider=openai のときに使うモデル
  #   "tts-1"            … 旧モデル。安価だが機械音っぽくトーンが揺れやすい
  #   "tts-1-hd"         … 高音質版だが instructions は未対応
  #   "gpt-4o-mini-tts"  … ★推奨。instructions で読み上げ方を固定でき、自然さ・一貫性が大幅向上
  openai_model: "gpt-4o-mini-tts"

  # TTS 1チャンクあたりの最大文字数（両プロバイダ共通）
  # 小さくするほど後半の早口化・トーン揺れが抑えられる。300前後が目安。
  chunk_max_chars: 300
