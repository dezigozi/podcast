name = "cast"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "PODCAST_BUCKET"
bucket_name = "podcast-audio"

[[kv_namespaces]]
binding = "PODCAST_KV"
id = "772501f2f8b54e1fad5608c67433fa3c"

[triggers]
crons = ["0 0 * * 1"]  # 毎週月曜 09:00 JST (UTC 00:00)

[vars]
PODCAST_BASE_URL = "https://cast.dezigozi.workers.dev"
