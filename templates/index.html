<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知のわんこそば</title>
  <link rel="icon" type="image/svg+xml" href="/static/icons/icon.svg" />
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/static/manifest.json" />
  <meta name="theme-color" content="#0284c7" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 40px;
      max-width: 620px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    h1 { font-size: 1.8rem; font-weight: 700; color: #38bdf8; margin-bottom: 8px; }
    .subtitle { color: #94a3b8; font-size: 0.95rem; margin-bottom: 28px; line-height: 1.6; }
    .persona-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .persona-btn {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 10px;
      padding: 14px 12px;
      cursor: pointer;
      text-align: left;
      color: #e2e8f0;
      transition: all 0.2s;
    }
    .persona-btn:hover { border-color: #38bdf8; background: #162032; }
    .persona-btn.selected { border-color: #38bdf8; background: #0c3a5e; }
    .persona-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .persona-name { font-weight: 600; font-size: 0.92rem; margin-bottom: 3px; }
    .persona-title { font-size: 0.75rem; color: #94a3b8; }
    .persona-sources { font-size: 0.65rem; color: #64748b; margin-top: 5px; line-height: 1.4; }
    .btn-row { display: flex; gap: 10px; margin-bottom: 0; }
    .generate-btn {
      flex: 1;
      padding: 14px;
      background: #0284c7;
      color: white;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .generate-btn:hover:not(:disabled) { background: #0369a1; }
    .generate-btn:disabled { background: #334155; cursor: not-allowed; color: #64748b; }
    .generate-all-btn {
      flex: 1;
      padding: 14px;
      background: #7c3aed;
      color: white;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .generate-all-btn:hover:not(:disabled) { background: #6d28d9; }
    .generate-all-btn:disabled { background: #334155; cursor: not-allowed; color: #64748b; }
    .status-area { margin-top: 20px; display: none; }
    .status-bar {
      background: #0f172a;
      border-radius: 8px;
      padding: 14px 18px;
      border-left: 4px solid #38bdf8;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid #334155;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-text { font-size: 0.9rem; color: #94a3b8; }

    /* 全員生成の進捗リスト */
    .group-status-list { display: flex; flex-direction: column; gap: 8px; }
    .group-status-item {
      background: #0f172a;
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .group-item-name { font-size: 0.88rem; font-weight: 600; min-width: 140px; }
    .group-item-label { font-size: 0.82rem; color: #94a3b8; flex: 1; }
    .group-item-spinner {
      width: 14px; height: 14px;
      border: 2px solid #334155;
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    .player-area { margin-top: 20px; display: none; background: #0f172a; border-radius: 12px; padding: 18px; }
    .player-label { font-size: 0.88rem; color: #38bdf8; margin-bottom: 12px; font-weight: 600; }
    audio { width: 100%; border-radius: 8px; }
    .download-btn {
      display: inline-block;
      margin-top: 12px;
      padding: 9px 18px;
      background: #0f4c75;
      color: #7dd3fc;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    .download-btn:hover { background: #1a6fa8; }
    .download-zip-btn {
      display: block;
      margin-top: 16px;
      padding: 14px;
      background: #4c1d95;
      color: #c4b5fd;
      border-radius: 10px;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
      transition: background 0.2s;
    }
    .download-zip-btn:hover { background: #5b21b6; }
    .error-area {
      margin-top: 14px;
      background: #450a0a;
      border-radius: 8px;
      padding: 14px;
      color: #fca5a5;
      font-size: 0.88rem;
      display: none;
      line-height: 1.5;
    }
  </style>
</head>
<body>
<div class="card">
  <h1>🎙️ 知のわんこそば</h1>
  <p class="subtitle">AIキャスターが今週のニュースを解説します。<br>1人選んで個別生成、または全員まとめて生成できます（約1〜2分/人）。</p>

  <div class="persona-grid" id="persona-grid"></div>

  <div class="btn-row">
    <button class="generate-btn" id="select-all-btn" onclick="toggleSelectAll()">全員選択</button>
    <button class="generate-all-btn" id="gen-btn" disabled onclick="startGenerate()">キャスターを選択</button>
  </div>

  <!-- 個別生成ステータス -->
  <div class="status-area" id="status-area">
    <div class="status-bar">
      <div class="spinner"></div>
      <span class="status-text" id="status-text">準備中...</span>
    </div>
  </div>

  <!-- 個別生成プレイヤー -->
  <div class="player-area" id="player-area">
    <div class="player-label" id="player-label"></div>
    <audio id="audio-player" controls></audio>
    <a id="download-link" class="download-btn" download>⬇️ MP3をダウンロード</a>
  </div>

  <!-- 全員生成ステータス -->
  <div class="status-area" id="group-status-area">
    <div class="group-status-list" id="group-status-list"></div>
    <a id="download-zip-link" class="download-zip-btn" style="display:none">⬇️ 全員分を1つのMP3でダウンロード</a>
  </div>

  <div class="error-area" id="error-area"></div>
</div>

<script>
  // 複数選択モード: 選ばれたペルソナID群
  const selectedSet = new Set();
  let allPersonaIds = [];
  let groupPollingTimer = null;

  async function loadPersonas() {
    try {
      const res = await fetch('/api/personas');
      const personas = await res.json();
      const grid = document.getElementById('persona-grid');
      allPersonaIds = personas.map(p => p.id);
      personas.forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'persona-btn';
        btn.dataset.id = p.id;
        btn.innerHTML = `<div class="persona-name">${p.name}</div><div class="persona-title">${p.title}</div><div class="persona-sources">📡 ${p.sources || ''}</div>`;
        btn.onclick = () => togglePersona(p.id, btn);
        grid.appendChild(btn);
      });
    } catch (e) {
      showError('ページ読み込みに失敗しました。再読み込みしてください。');
    }
  }

  function togglePersona(id, btn) {
    if (selectedSet.has(id)) {
      selectedSet.delete(id);
      btn.classList.remove('selected');
    } else {
      selectedSet.add(id);
      btn.classList.add('selected');
    }
    updateGenButton();
  }

  function toggleSelectAll() {
    const allSelected = selectedSet.size === allPersonaIds.length;
    selectedSet.clear();
    document.querySelectorAll('.persona-btn').forEach(b => b.classList.remove('selected'));
    if (!allSelected) {
      allPersonaIds.forEach(id => selectedSet.add(id));
      document.querySelectorAll('.persona-btn').forEach(b => b.classList.add('selected'));
    }
    updateGenButton();
  }

  function updateGenButton() {
    const genBtn = document.getElementById('gen-btn');
    const selBtn = document.getElementById('select-all-btn');
    const n = selectedSet.size;
    if (n === 0) {
      genBtn.disabled = true;
      genBtn.textContent = 'キャスターを選択';
    } else if (n === allPersonaIds.length) {
      genBtn.disabled = false;
      genBtn.textContent = `🎙️ 全員（${n}人）を生成`;
    } else {
      genBtn.disabled = false;
      genBtn.textContent = `🎙️ ${n}人を生成`;
    }
    selBtn.textContent = (n === allPersonaIds.length) ? '選択クリア' : '全員選択';
  }

  // ── 生成（1人でも複数でも /api/generate-all を使い、結果は1mp3連結DL） ────
  async function startGenerate() {
    if (selectedSet.size === 0) return;
    clearInterval(groupPollingTimer);
    setGenerating(true);
    hideError();
    document.getElementById('player-area').style.display = 'none';

    const persona_ids = Array.from(selectedSet);
    try {
      const res = await fetch('/api/generate-all', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ persona_ids }),
      });
      const data = await res.json();
      if (!res.ok) { showError(data.error || '生成開始に失敗しました'); setGenerating(false); return; }
      pollGroupStatus(data.group_id, data.job_ids);
    } catch (e) {
      showError('サーバーへの接続に失敗しました。');
      setGenerating(false);
    }
  }

  function setGenerating(on) {
    const genBtn = document.getElementById('gen-btn');
    const selBtn = document.getElementById('select-all-btn');
    document.querySelectorAll('.persona-btn').forEach(b => b.disabled = on);
    selBtn.disabled = on;
    if (on) {
      genBtn.disabled = true;
      genBtn.textContent = '生成中...';
    } else {
      updateGenButton();
    }
  }

  function pollGroupStatus(group_id, job_ids) {
    const list = document.getElementById('group-status-list');
    document.getElementById('group-status-area').style.display = 'block';
    document.getElementById('download-zip-link').style.display = 'none';

    // 初期表示
    list.innerHTML = '';
    job_ids.forEach(jid => {
      const el = document.createElement('div');
      el.className = 'group-status-item';
      el.id = `group-item-${jid}`;
      el.innerHTML = `<span class="group-item-name">—</span><span class="group-item-label">待機中...</span><div class="group-item-spinner"></div>`;
      list.appendChild(el);
    });

    groupPollingTimer = setInterval(async () => {
      try {
        const res = await fetch(`/api/group-status/${group_id}`);
        let data;
        try { data = await res.json(); } catch (_) { throw new Error(`サーバーエラー HTTP ${res.status}`); }
        if (res.status === 404) throw new Error('サーバーが再起動してジョブが消えました。もう一度生成してください。');
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

        data.statuses.forEach(s => {
          const el = document.getElementById(`group-item-${s.job_id}`);
          if (!el) return;
          const name = s.persona_name || s.persona_id;
          const isDone = s.status === 'done';
          const isError = s.status === 'error';
          el.innerHTML = `
            <span class="group-item-name">${name}</span>
            <span class="group-item-label">${s.label || s.status}</span>
            ${isDone ? '✅' : isError ? '❌' : '<div class="group-item-spinner"></div>'}
          `;
        });

        if (data.all_done) {
          clearInterval(groupPollingTimer);
          setGenerating(false);
          const zipLink = document.getElementById('download-zip-link');
          zipLink.href = `/api/download-all/${group_id}`;
          zipLink.style.display = 'block';
        } else if (data.any_error) {
          clearInterval(groupPollingTimer);
          setGenerating(false);
          showError('一部のキャスターの生成に失敗しました。');
        }
      } catch (e) {
        clearInterval(groupPollingTimer);
        setGenerating(false);
        showError('エラー: ' + (e.message || 'ステータス確認に失敗しました'));
      }
    }, 2000);
  }

  function showError(msg) {
    const el = document.getElementById('error-area');
    el.style.display = 'block';
    el.textContent = `⚠️ ${msg}`;
  }

  function hideError() {
    document.getElementById('error-area').style.display = 'none';
  }

  loadPersonas();
</script>
</body>
</html>
